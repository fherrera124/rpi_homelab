---
- name: Reiniciar cliente de la Sangean
  ansible.builtin.systemd_service:
    name: snapclient-sangean.service
    state: restarted
    scope: user
  become: true
  become_user: "{{ soloist_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ soloist_uid }}"

- name: Reiniciar despertador de la Sangean
  ansible.builtin.systemd_service:
    name: sangean-wake.service
    state: restarted
    daemon_reload: true
