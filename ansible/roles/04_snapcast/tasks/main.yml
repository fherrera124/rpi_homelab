---
- name: Verificar que la API key de Soloist esta en el vault
  ansible.builtin.assert:
    that:
      - vault_soloist_api_key is defined
      - vault_soloist_api_key | length > 0
    fail_msg: >-
      Falta vault_soloist_api_key. Agregala con:
      ansible-vault edit group_vars/all/vault.yml
      (se obtiene en https://developer.spotify.com/dashboard/soloist,
      requiere una cuenta Premium para generarla).

- name: Verificar que la arquitectura tiene build de Soloist
  ansible.builtin.assert:
    that: ansible_architecture in soloist_arch_map
    fail_msg: >-
      Soloist no publica build para {{ ansible_architecture }}.
      Soportadas: {{ soloist_arch_map.keys() | list | join(', ') }}.
      Nota: las Pi 1 y Zero son ARMv6 y NO sirven, el build arm32 es ARMv7.

- name: Instalar Snapserver y el stack de audio
  ansible.builtin.apt:
    pkg:
      - snapserver
      # PipeWire en vez de PulseAudio: en trixie son 44 paquetes contra 115.
      - pipewire
      - pipewire-pulse
      - wireplumber
      - pulseaudio-utils
      # acl permite que Ansible escale a un usuario sin privilegios (become_user).
      - acl
    state: present

- name: Instalar Icecast y darkice para el stream HTTP
  ansible.builtin.apt:
    pkg:
      - icecast2
      # darkice y no ffmpeg: 18 paquetes contra 169, y lee PulseAudio nativo.
      - darkice
    state: present
  when: icecast_enabled

- name: Crear usuario de sistema para la sesion de audio
  ansible.builtin.user:
    name: "{{ soloist_user }}"
    system: true
    create_home: true
    home: "{{ soloist_home }}"
    shell: /usr/sbin/nologin
    groups: audio
    append: true
  register: soloist_account

- name: Fijar el UID de soloist para las sesiones systemd --user
  ansible.builtin.set_fact:
    soloist_uid: "{{ soloist_account.uid }}"

- name: Habilitar linger (sostiene systemd --user sin login real)
  ansible.builtin.command: "loginctl enable-linger {{ soloist_user }}"
  args:
    creates: "/var/lib/systemd/linger/{{ soloist_user }}"

- name: Esperar a que la sesion de usuario este disponible
  ansible.builtin.wait_for:
    path: "/run/user/{{ soloist_uid }}"
    timeout: 30

- name: Desplegar regla de tmpfiles para el FIFO
  ansible.builtin.template:
    src: tmpfiles-snapcast.conf.j2
    dest: /etc/tmpfiles.d/snapcast-soloist.conf
    owner: root
    group: root
    mode: '0644'
  notify: Recargar reglas de tmpfiles

- name: Crear el FIFO si todavia no existe
  ansible.builtin.command: systemd-tmpfiles --create /etc/tmpfiles.d/snapcast-soloist.conf
  args:
    creates: "{{ soloist_fifo }}"

- name: Instalar el binario de Soloist
  ansible.builtin.unarchive:
    src: "{{ soloist_builds_url }}/soloist_release_{{ soloist_arch_map[ansible_architecture] }}.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    owner: root
    group: root
    mode: '0755'
    creates: "{{ soloist_binary }}"

- name: Crear directorio de la API key
  ansible.builtin.file:
    path: /etc/soloist
    state: directory
    owner: root
    group: "{{ soloist_user }}"
    mode: '0750'

- name: Desplegar la API key de Soloist
  ansible.builtin.template:
    src: soloist-env.j2
    dest: /etc/soloist/soloist.env
    owner: root
    group: "{{ soloist_user }}"
    mode: '0640'
  no_log: true
  notify: Reiniciar Soloist

- name: Desplegar configuracion no secreta de Soloist
  ansible.builtin.template:
    src: soloist-default.j2
    dest: /etc/default/soloist
    owner: root
    group: root
    mode: '0644'
  notify: Reiniciar Soloist

- name: Crear directorio de units de usuario
  ansible.builtin.file:
    path: "{{ soloist_home }}/.config/systemd/user"
    state: directory
    owner: "{{ soloist_user }}"
    group: "{{ soloist_user }}"
    mode: '0755'

- name: Desplegar units de usuario
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ soloist_home }}/.config/systemd/user/{{ item.dest }}"
    owner: "{{ soloist_user }}"
    group: "{{ soloist_user }}"
    mode: '0644'
  loop:
    - { src: soloist-pipe-sink.service.j2, dest: soloist-pipe-sink.service }
    - { src: soloist.service.j2, dest: soloist.service }
  notify:
    - Recargar systemd de usuario
    - Reiniciar pipe-sink de Soloist
    - Reiniciar Soloist

- name: Aplicar cambios pendientes antes de habilitar servicios
  ansible.builtin.meta: flush_handlers

- name: Habilitar la sesion PipeWire del usuario soloist
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    scope: user
    enabled: true
    state: started
  become: true
  become_user: "{{ soloist_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ soloist_uid }}"
  loop:
    - pipewire.socket
    - pipewire-pulse.socket
    - wireplumber.service

- name: Habilitar pipe-sink y Soloist
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    scope: user
    enabled: true
    state: started
  become: true
  become_user: "{{ soloist_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ soloist_uid }}"
  loop:
    - soloist-pipe-sink.service
    - soloist.service

- name: Comprobar la version instalada de Snapweb
  ansible.builtin.command: dpkg-query -W -f=${Version} snapweb
  register: snapweb_installed
  failed_when: false
  changed_when: false
  # Es una consulta de solo lectura: debe correr tambien en --check, o las
  # tareas que dependen de su resultado se evaluan con la variable vacia.
  check_mode: false

# El paquete Debian de snapserver solo trae un placeholder en
# /usr/share/snapserver/snapweb; la interfaz real se publica aparte.
- name: Descargar el paquete de Snapweb
  ansible.builtin.get_url:
    url: "{{ snapweb_deb_url }}"
    dest: /tmp/snapweb.deb
    mode: '0644'
  when: snapweb_version not in snapweb_installed.stdout

- name: Instalar Snapweb
  ansible.builtin.apt:
    deb: /tmp/snapweb.deb
    state: present
  when: snapweb_version not in snapweb_installed.stdout
  notify: Reiniciar Snapserver

- name: Limpiar el paquete descargado
  ansible.builtin.file:
    path: /tmp/snapweb.deb
    state: absent

- name: Desplegar el control script de metadata
  ansible.builtin.template:
    src: meta_soloist.py.j2
    dest: "{{ snapcast_plugin_dir }}/{{ snapcast_controlscript }}"
    owner: root
    group: root
    mode: '0755'
  notify: Reiniciar Snapserver

- name: Desplegar configuracion de Snapserver
  ansible.builtin.template:
    src: snapserver.conf.j2
    dest: /etc/snapserver.conf
    owner: root
    group: root
    mode: '0644'
    backup: true
  notify: Reiniciar Snapserver

- name: Habilitar Snapserver
  ansible.builtin.systemd_service:
    name: snapserver
    enabled: true
    state: started

# --- Stream HTTP para radios de internet ---

- name: Verificar que la password de Icecast esta en el vault
  ansible.builtin.assert:
    that:
      - vault_icecast_source_password is defined
      - vault_icecast_source_password | length > 0
    fail_msg: >-
      Falta vault_icecast_source_password. Agregala con:
      ansible-vault edit group_vars/all/vault.yml
  when: icecast_enabled

- name: Desplegar configuracion de Icecast
  ansible.builtin.template:
    src: icecast.xml.j2
    dest: /etc/icecast2/icecast.xml
    owner: root
    group: icecast
    mode: '0640'
  when: icecast_enabled
  notify: Reiniciar Icecast

- name: Habilitar el arranque de Icecast en Debian
  ansible.builtin.lineinfile:
    path: /etc/default/icecast2
    regexp: '^ENABLE='
    line: 'ENABLE=true'
  when: icecast_enabled
  notify: Reiniciar Icecast

- name: Desplegar configuracion de darkice
  ansible.builtin.template:
    src: darkice.cfg.j2
    dest: /etc/darkice.cfg
    owner: root
    group: "{{ soloist_user }}"
    mode: '0640'
  when: icecast_enabled
  notify: Reiniciar darkice

- name: Desplegar credencial de Icecast para el publicador de metadata
  ansible.builtin.template:
    src: icecast-env.j2
    dest: /etc/soloist/icecast.env
    owner: root
    group: "{{ soloist_user }}"
    mode: '0640'
  no_log: true
  when: icecast_enabled
  notify: Reiniciar icymeta

- name: Desplegar el publicador de metadata ICY
  ansible.builtin.template:
    src: soloist-icymeta.py.j2
    dest: /usr/local/bin/soloist-icymeta.py
    owner: root
    group: root
    mode: '0755'
  when: icecast_enabled
  notify: Reiniciar icymeta

- name: Desplegar units de darkice e icymeta
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ soloist_home }}/.config/systemd/user/{{ item }}"
    owner: "{{ soloist_user }}"
    group: "{{ soloist_user }}"
    mode: '0644'
  loop:
    - soloist-darkice.service
    - soloist-icymeta.service
  when: icecast_enabled
  notify:
    - Recargar systemd de usuario
    - Reiniciar darkice
    - Reiniciar icymeta

- name: Habilitar Icecast
  ansible.builtin.systemd_service:
    name: icecast2
    enabled: true
    state: started
  when: icecast_enabled

- name: Habilitar darkice e icymeta
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    scope: user
    enabled: true
    state: started
  become: true
  become_user: "{{ soloist_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ soloist_uid }}"
  loop:
    - soloist-darkice.service
    - soloist-icymeta.service
  when: icecast_enabled

- name: Desplegar el renovador del binario de Soloist
  ansible.builtin.template:
    src: update-soloist.sh.j2
    dest: /usr/local/sbin/update-soloist.sh
    owner: root
    group: root
    mode: '0755'

- name: Desplegar unit y timer del renovador
  ansible.builtin.template:
    src: "update-soloist.{{ item }}.j2"
    dest: "/etc/systemd/system/update-soloist.{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - service
    - timer
  notify: Reiniciar timer de actualizacion

- name: Habilitar el timer semanal de actualizacion
  ansible.builtin.systemd_service:
    name: update-soloist.timer
    enabled: true
    state: started
    daemon_reload: true

# --- La Sangean como cliente de Snapweb ---

- name: Instalar snapclient para el cliente fantasma de la Sangean
  ansible.builtin.apt:
    pkg: snapclient
    state: present
  when: sangean_enabled

# El paquete trae su propio snapclient.service y lo deja habilitado: sin esto
# aparece un cliente "rpi2" en Snapweb sacando audio por el jack de la placa,
# que en un hub de distribucion no tiene ningun sentido.
- name: Enmascarar el snapclient por defecto del paquete
  ansible.builtin.systemd_service:
    name: snapclient.service
    state: stopped
    enabled: false
    masked: true
  when: sangean_enabled

- name: Desplegar el mixer que traduce el slider a SOAP
  ansible.builtin.template:
    src: sangean-mixer.sh.j2
    dest: /usr/local/bin/sangean-mixer.sh
    owner: root
    group: root
    mode: '0755'
  when: sangean_enabled
  notify: Reiniciar cliente de la Sangean

- name: Desplegar el unit del cliente de la Sangean
  ansible.builtin.template:
    src: snapclient-sangean.service.j2
    dest: /etc/systemd/system/snapclient-sangean.service
    owner: root
    group: root
    mode: '0644'
  when: sangean_enabled
  notify: Reiniciar cliente de la Sangean

- name: Habilitar el cliente de la Sangean
  ansible.builtin.systemd_service:
    name: snapclient-sangean.service
    enabled: true
    state: started
    daemon_reload: true
  when: sangean_enabled

- name: Aplicar cambios del cliente antes de nombrarlo
  ansible.builtin.meta: flush_handlers

- name: Esperar a que el cliente se registre en Snapserver
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ snapcast_http_port }}/jsonrpc"
    method: POST
    body_format: json
    body:
      id: 1
      jsonrpc: "2.0"
      method: Server.GetStatus
  register: snapcast_status
  until: >-
    snapcast_status.json.result.server.groups | map(attribute='clients') | flatten
    | selectattr('id', 'equalto', sangean_client_id) | list | length > 0
  retries: 10
  delay: 2
  changed_when: false
  failed_when: false
  # Consulta de solo lectura: debe correr tambien en --check, o la tarea
  # siguiente se evalua con la variable vacia.
  check_mode: false
  when: sangean_enabled

- name: Determinar el nombre actual del cliente
  ansible.builtin.set_fact:
    sangean_current_name: >-
      {{ snapcast_status.json.result.server.groups | default([])
         | map(attribute='clients') | flatten
         | selectattr('id', 'equalto', sangean_client_id)
         | map(attribute='config') | map(attribute='name')
         | first | default('') }}
  when:
    - sangean_enabled
    - snapcast_status.json is defined

# Sin esto el cliente hereda el hostname de la Pi y aparece como "rpi2", igual
# que cualquier otro snapclient que corra ahi.
- name: Nombrar el cliente de la Sangean en Snapweb
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ snapcast_http_port }}/jsonrpc"
    method: POST
    body_format: json
    body:
      id: 2
      jsonrpc: "2.0"
      method: Client.SetName
      params:
        id: "{{ sangean_client_id }}"
        name: "{{ sangean_client_name }}"
  when:
    - sangean_enabled
    - sangean_current_name is defined
    - sangean_current_name != sangean_client_name

# --- Encendido automatico de la Sangean ---

- name: Desplegar el despertador de la Sangean
  ansible.builtin.template:
    src: sangean-wake.py.j2
    dest: /usr/local/bin/sangean-wake.py
    owner: root
    group: root
    mode: '0755'
  when: sangean_wake_enabled
  notify: Reiniciar despertador de la Sangean

- name: Desplegar el unit del despertador
  ansible.builtin.template:
    src: sangean-wake.service.j2
    dest: /etc/systemd/system/sangean-wake.service
    owner: root
    group: root
    mode: '0644'
  when: sangean_wake_enabled
  notify: Reiniciar despertador de la Sangean

- name: Habilitar el despertador de la Sangean
  ansible.builtin.systemd_service:
    name: sangean-wake.service
    enabled: true
    state: started
    daemon_reload: true
  when: sangean_wake_enabled
