---
# Las units de Soloist viven en la sesion systemd --user del usuario soloist,
# por eso los handlers escalan a ese usuario y le pasan XDG_RUNTIME_DIR.
- name: Recargar systemd de usuario
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user
  become: true
  become_user: "{{ soloist_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ soloist_uid }}"

- name: Reiniciar Soloist
  ansible.builtin.systemd_service:
    name: soloist.service
    state: restarted
    scope: user
  become: true
  become_user: "{{ soloist_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ soloist_uid }}"

- name: Reiniciar pipe-sink de Soloist
  ansible.builtin.systemd_service:
    name: soloist-pipe-sink.service
    state: restarted
    scope: user
  become: true
  become_user: "{{ soloist_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ soloist_uid }}"

- name: Reiniciar Snapserver
  ansible.builtin.systemd_service:
    name: snapserver
    state: restarted

- name: Recargar reglas de tmpfiles
  ansible.builtin.command: systemd-tmpfiles --create /etc/tmpfiles.d/snapcast-soloist.conf
  changed_when: true

- name: Reiniciar timer de actualizacion
  ansible.builtin.systemd_service:
    name: update-soloist.timer
    state: restarted
    daemon_reload: true

- name: Reiniciar Icecast
  ansible.builtin.systemd_service:
    name: icecast2
    state: restarted

- name: Reiniciar darkice
  ansible.builtin.systemd_service:
    name: soloist-darkice.service
    state: restarted
    scope: user
  become: true
  become_user: "{{ soloist_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ soloist_uid }}"

- name: Reiniciar icymeta
  ansible.builtin.systemd_service:
    name: soloist-icymeta.service
    state: restarted
    scope: user
  become: true
  become_user: "{{ soloist_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ soloist_uid }}"
