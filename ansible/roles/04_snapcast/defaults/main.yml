---
# Usuario de sistema que corre la sesion PipeWire y Soloist.
# Sin login real: la sesion systemd --user se sostiene con linger.
soloist_user: soloist
soloist_home: /var/lib/soloist

# Soloist solo sabe salir por PulseAudio (hace dlopen de libpulse.so.0; no
# tiene backend ALSA ni salida a stdout), asi que el puente pipe-sink -> FIFO
# es obligatorio para alimentar a Snapserver.
soloist_binary: /usr/local/bin/soloist
soloist_fifo_dir: /run/snapcast
soloist_fifo: /run/snapcast/soloist

# Los builds de Spotify vencen a los 90 dias (exit code 10); el timer los renueva.
soloist_builds_url: https://soloist-builds.spotifycdn.com
soloist_arch_map:
  armv7l: arm32
  aarch64: arm64
  x86_64: x86_64

# Nombre visible en la app de Spotify.
soloist_device_name: "Snapcast Hub RPi2"

# Tope de cache. El default de Soloist es ilimitado, inaceptable sobre una SD.
soloist_cache_mb: 500

# Formato del FIFO. 44100 es la tasa nativa de Spotify: con otra, PipeWire tiene
# que resamplear, y eso es una alteracion del audio que se evita de punta a
# punta (ver tambien el reloj de PipeWire, templates/pipewire-rate.conf.j2).
# 16 bits: segun foonerd/alsa_soloist_connect, Soloist decodifica lossy a S16 y
# lossless a FLOAT32; este ultimo caso pierde resolucion al bajar a 16 bits.
soloist_sink_format: s16le
soloist_sink_rate: 44100
soloist_sink_channels: 2

# Snapserver. flac: sin perdida, un unico stream para todos los clientes.
# Cuesta ancho de banda (del orden de 0,7-1 Mbps por cliente, contra ~128 kbps
# de opus): si algun cliente por wifi (ESP32) empieza a loguear "audio starved",
# volver a snapcast_codec: opus es una variable, pero a costa de fidelidad.
# El sampleformat se deriva del FIFO para que no puedan divergir.
snapcast_stream_name: Soloist
snapcast_codec: flac
snapcast_sampleformat: "{{ soloist_sink_rate }}:16:{{ soloist_sink_channels }}"
snapcast_buffer_ms: 500
snapcast_http_port: 1780
snapcast_tcp_port: 1705

# El paquete Debian de snapserver trae solo un placeholder de 2 KB en
# /usr/share/snapserver/snapweb; la interfaz real se instala aparte desde las
# releases del proyecto y va a /usr/share/snapweb.
snapweb_version: "0.9.3"
snapweb_deb_url: "https://github.com/snapcast/snapweb/releases/download/v{{ snapweb_version }}/snapweb_{{ snapweb_version }}-1_all.deb"
snapcast_doc_root: /usr/share/snapweb

# API WebSocket de Soloist, de donde el control script saca la metadata.
# Puerto FIJO a proposito: Soloist publica el asignado en
# <data-dir>/ws.port, pero ese archivo vive en un directorio 700 del usuario
# soloist y el control script corre como _snapserver, que no puede leerlo.
# Escucha solo en loopback, no se expone a la LAN.
soloist_ws_port: 9876

# Control script que publica la metadata en la API de Snapcast y traduce los
# comandos de transporte que llegan desde Snapweb. Vive en el plugin_dir de
# snapserver.
snapcast_plugin_dir: /usr/share/snapserver/plug-ins
snapcast_controlscript: meta_soloist.py

# Convivencia con otros servicios de la Pi: el audio no debe ganarle CPU a nada critico.
soloist_nice: 5
soloist_cpu_weight: 50

# Chequeo semanal del binario.
soloist_update_oncalendar: "Sun *-*-* 04:00:00"
