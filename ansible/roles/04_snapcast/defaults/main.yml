---
# Usuario de sistema que corre la sesion PipeWire y Soloist.
# Sin login real: la sesion systemd --user se sostiene con linger.
soloist_user: soloist
soloist_home: /var/lib/soloist

# Soloist solo sabe salir por PulseAudio (hace dlopen de libpulse.so.0; no
# tiene backend ALSA ni salida a stdout), asi que el puente pipe-sink -> FIFO
# es obligatorio para alimentar a Snapserver.
soloist_binary: /usr/local/bin/soloist
soloist_fifo_dir: /run/snapcast
soloist_fifo: /run/snapcast/soloist

# Los builds de Spotify vencen a los 90 dias (exit code 10); el timer los renueva.
soloist_builds_url: https://soloist-builds.spotifycdn.com
soloist_arch_map:
  armv7l: arm32
  aarch64: arm64
  x86_64: x86_64

# Nombre visible en la app de Spotify.
soloist_device_name: "Snapcast Hub RPi2"

# Tope de cache. El default de Soloist es ilimitado, inaceptable sobre una SD.
soloist_cache_mb: 500

# Formato del FIFO. Debe coincidir con snapcast_sampleformat.
soloist_sink_format: s16le
soloist_sink_rate: 48000
soloist_sink_channels: 2

# Snapserver. opus (~128 kbps) es lo que aguantan los ESP32 por wifi: con PCM a
# ~1,5 Mbps aparecen "audio starved". Snapweb tambien lo decodifica, su bundle
# trae opus-decoder en WASM, asi que un unico stream sirve a todos los clientes.
snapcast_stream_name: Soloist
snapcast_codec: opus
snapcast_sampleformat: "48000:16:2"
snapcast_buffer_ms: 500
snapcast_http_port: 1780
snapcast_tcp_port: 1705

# El paquete Debian de snapserver trae solo un placeholder de 2 KB en
# /usr/share/snapserver/snapweb; la interfaz real se instala aparte desde las
# releases del proyecto y va a /usr/share/snapweb.
snapweb_version: "0.9.3"
snapweb_deb_url: "https://github.com/snapcast/snapweb/releases/download/v{{ snapweb_version }}/snapweb_{{ snapweb_version }}-1_all.deb"
snapcast_doc_root: /usr/share/snapweb

# API WebSocket de Soloist, de donde el control script saca la metadata.
# Puerto FIJO a proposito: Soloist publica el asignado en
# <data-dir>/ws.port, pero ese archivo vive en un directorio 700 del usuario
# soloist y el control script corre como _snapserver, que no puede leerlo.
# Escucha solo en loopback, no se expone a la LAN.
soloist_ws_port: 9876

# Control script que publica la metadata en la API de Snapcast y traduce los
# comandos de transporte que llegan desde Snapweb. Vive en el plugin_dir de
# snapserver.
snapcast_plugin_dir: /usr/share/snapserver/plug-ins
snapcast_controlscript: meta_soloist.py

# --- Stream HTTP para radios de internet (Icecast + darkice) ---
# Existe para equipos que no hablan snapcast, como la Sangean WFR-28: sintonizan
# una URL como si fuera una emisora.
#
# darkice lee del monitor del sink (soloist_sink.monitor), asi que NO hace falta
# un segundo FIFO ni un combine-sink: se cuelga del mismo audio que ya sale
# hacia Snapcast.
icecast_enabled: true
icecast_port: 8000
icecast_mount: /soloist.mp3
icecast_source_user: source
# MP3 y no opus: las Frontier Silicon manejan MP3, WMA y AAC; opus en esa
# generacion no existe.
darkice_format: mp3
darkice_bitrate: 128
darkice_buffer_secs: 5
darkice_stream_name: Soloist
# Sin acentos a proposito: darkice no declara charset y terminan como mojibake.
darkice_stream_description: Spotify Connect via Snapcast

# Metadata ICY: el titulo que muestra la radio en pantalla.
icymeta_idle_text: "{{ soloist_device_name }}"
# Las pantallas de estas radios son chicas.
icymeta_max_len: 60

# Convivencia con otros servicios de la Pi: el audio no debe ganarle CPU a nada critico.
soloist_nice: 5
soloist_cpu_weight: 50

# Chequeo semanal del binario.
soloist_update_oncalendar: "Sun *-*-* 04:00:00"

# --- La Sangean como cliente de Snapweb ---
# La radio se alimenta del stream de Icecast, no de snapcast, asi que Snapweb no
# la ve y no hay forma de bajarle el volumen desde la interfaz. Este snapclient
# no reproduce nada (--player file:filename=null): existe solo para ocupar una
# fila, y su mixer traduce el slider a SOAP contra el RenderingControl de la
# radio.
#
# Verificado en la WFR-28: SetVolume y SetMute cambian el volumen audible.
# Limitaciones conocidas, inherentes al diseno:
#  - La radio va segundos detras de los demas clientes (buffer de Icecast), y el
#    slider de latencia de Snapweb sobre este cliente no hace nada porque mueve
#    una reproduccion que se descarta.
#  - La presencia miente: el proceso corre en la Pi, asi que figura conectado
#    aunque la radio este apagada.
#  - Pausa, next y prev siguen siendo del stream (una sola fuente Spotify); el
#    equivalente por dispositivo es el mute, y ese si funciona.
sangean_enabled: true
sangean_host: 192.168.100.17
sangean_upnp_port: 8080
# El --hostID pasa a ser el id del cliente en snapserver; fijo, para que la
# entrada sobreviva reinicios y se le pueda poner nombre de forma idempotente.
sangean_client_id: sangean
sangean_client_name: Sangean WFR-28
# Corto a proposito: si la radio esta apagada no tiene sentido esperarla, y el
# mixer no debe demorar la cadena de snapclient.
sangean_soap_timeout: 4
# Con el default (*:info) snapclient escribe "No chunks available" una vez por
# segundo mientras el stream esta idle: ~86k lineas por dia en el journal, de un
# cliente cuya cadena de audio ademas se descarta.
sangean_log_filter: "*:warning"

# --- Encendido automatico de la Sangean ---
# Cuando el stream pasa a "playing", la radio se enciende sola: se le empuja la
# URL de Icecast por DLNA (SetAVTransportURI + Play) al mismo endpoint que usa
# sangean-mixer.sh. El push la saca de standby por su cuenta, en menos de 4 s
# medidos, y no necesita PIN ni sesion.
#
# El precio es la pantalla: con la fuente empujada la radio nunca pide metadata
# ICY, asi que no muestra el track, solo el dc:title estatico. A cambio siempre
# suena esta URL, sin depender de cual fue la ultima emisora sintonizada.
sangean_wake_enabled: true
# Por nginx (puerto 80) y NO directo a Icecast: la radio valida la URI con un
# HEAD antes de aceptarla, e Icecast contesta 400 a cualquier HEAD. Apuntado al
# 8000 el push falla con errorCode 716 (resource not found) sin llegar a mirar
# el audio. Quien contesta ese HEAD es el vhost stream-lan del rol 01_infra.
# El titulo estatico que acompana al push sale de darkice_stream_name.
sangean_stream_url: "http://{{ ansible_default_ipv4.address }}{{ icecast_mount }}"
# Un parpadeo playing -> idle -> playing no debe encenderla dos veces.
sangean_wake_cooldown: 60
# Mas holgado que sangean_soap_timeout: aca nadie espera al otro lado, y la
# radio recien salida de standby puede tardar en contestar.
sangean_wake_timeout: 8
