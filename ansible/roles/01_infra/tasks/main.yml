---
- name: Actualizar repositorios y paquetes del sistema
  ansible.builtin.apt:
    update_cache: yes
    upgrade: dist
    dpkg_options: 'force-confdef,force-confold'
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Instalar dependencias núcleo (Infraestructura)
  ansible.builtin.apt:
    pkg:
      - curl
      - nginx
    state: present

- name: Aumentar hash bucket size de Nginx para subdominios largos
  ansible.builtin.lineinfile:
    path: /etc/nginx/nginx.conf
    regexp: '^\s*#?\s*server_names_hash_bucket_size'
    line: '    server_names_hash_bucket_size 64;'
    insertafter: 'http \{'
  notify: Recargar Nginx

- name: Comprobar la version instalada de Cloudflared
  ansible.builtin.command: dpkg-query -W -f=${Version} cloudflared
  register: cloudflared_installed
  failed_when: false
  changed_when: false
  # Es una consulta de solo lectura: debe correr tambien en --check, o las
  # tareas de abajo se evaluan con la variable vacia.
  check_mode: false

- name: Descargar paquete de Cloudflared
  ansible.builtin.get_url:
    url: "{{ cloudflared_deb_url }}"
    dest: /tmp/cloudflared.deb
    mode: '0644'
  when: cloudflared_version not in cloudflared_installed.stdout

# Condicionada a la descarga: en --check get_url no baja nada, y sin este
# guard apt fallaba con "Could not open file /tmp/cloudflared.deb".
- name: Instalar Cloudflared
  ansible.builtin.apt:
    deb: /tmp/cloudflared.deb
    state: present
  when: cloudflared_version not in cloudflared_installed.stdout

- name: Limpiar el paquete descargado
  ansible.builtin.file:
    path: /tmp/cloudflared.deb
    state: absent

- name: Registrar servicio de Cloudflare Tunnel
  ansible.builtin.command: "cloudflared service install {{ vault_cf_tunnel_token }}"
  args:
    creates: /etc/systemd/system/cloudflared.service
  notify: Reiniciar cloudflared

- name: Crear estructura de directorios base (Nginx e Infra)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ homelab_path }}"
    - "/var/www/portfolio"
    - "/var/www/monitor-app"

- name: Desplegar el map de upgrade para WebSockets
  ansible.builtin.template:
    src: nginx/websocket-upgrade.conf.j2
    dest: /etc/nginx/conf.d/websocket-upgrade.conf
    mode: '0644'
  notify: Recargar Nginx

- name: Compilar plantillas de Nginx
  ansible.builtin.template:
    src: "nginx/{{ item }}.j2"
    dest: "/etc/nginx/sites-available/{{ item }}"
    mode: '0644'
  loop:
    - portfolio
    - monitor-app
    - delegate
    - snapcast
  notify: Recargar Nginx

- name: Activar sitios de Nginx (Symlinks)
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ item }}"
    dest: "/etc/nginx/sites-enabled/{{ item }}"
    state: link
  loop:
    - portfolio
    - monitor-app
    - delegate
    - snapcast
  notify: Recargar Nginx

- name: Eliminar sitio Nginx por defecto del SO
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Recargar Nginx